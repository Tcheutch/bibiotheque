<div class="container col-md-6 offset-mid-3">
    <h3 class="text-center"> Nouvelle réservation </h3>
    <form (ngSubmit) = "onSubmit()" autocomplete="off">

        <div class="form-group">
            <label style="margin-bottom: 10px"> Livre </label>
            <select class="form-select" style="margin-bottom: 10px" id="livreId"
                    [ngModel]="livreId" (ngModelChange)="onLivreIdChange($event)" name="livreId">
                <option [ngValue]="undefined">-- Choisir un livre --</option>
                <option *ngFor="let livre of livres" [ngValue]="livre.bookId">{{ livre.bookName }}</option>
            </select>
        </div>

        <div class="form-group" *ngIf="afficherSelecteurAdherent">
            <label style="margin-bottom: 10px"> Adhérent </label>
            <select class="form-select" style="margin-bottom: 10px" id="adherentId"
                    [ngModel]="adherentId" (ngModelChange)="onAdherentIdChange($event)" name="adherentId">
                <option [ngValue]="undefined">-- Choisir un adhérent --</option>
                <option *ngFor="let adherent of adherents" [ngValue]="adherent.userId">{{ adherent.name }}</option>
            </select>
        </div>

        <button class="btn btn-success" type="submit"
                [disabled]="!livreId || (afficherSelecteurAdherent && !adherentId)"> Réserver </button>

        <div *ngIf="succesVisible" class="alert alert-success mt-2" role="status">
            Réservation créée avec succès.
        </div>

        <div *ngIf="erreurCreation" class="alert alert-danger mt-2" role="alert">
            <p class="mb-1">{{ erreurCreation }}</p>
            <ul *ngIf="erreursChamps" class="mb-0 ps-3">
                <li *ngFor="let champ of erreursChamps | keyvalue">{{ champ.value }}</li>
            </ul>
        </div>
    </form>
</div>
